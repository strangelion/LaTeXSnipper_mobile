name: Security Compliance Scan

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  security-events: write

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  malicious-code-scan:
    name: Malicious Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for obfuscated / suspicious JS patterns
        shell: bash
        run: |
          set +e
          echo "===== Malicious Code Scan ====="
          VIOLATIONS=0
          SKIP='node_modules/* dist/* ./dist/* android/app/build/* android/build/* public/vendor/* ./public/vendor/* *.onnx *.bin'

          skip_file() {
            local f="$1"
            case "$f" in
              node_modules/*|dist/*|android/app/build/*|android/build/*) return 0 ;;
              *.onnx|*.bin) return 0 ;;
            esac
            # vendor/ can be nested multiple levels deep (e.g. public/vendor/mathjax/foo.js)
            [[ "$f" =~ (^|/)public/vendor/ ]] && return 0
            return 1
          }

          # 1. eval
          echo "[CHECK 1/12] Checking eval-like patterns ..."
          while IFS=: read -r file line _; do
            skip_file "$file" && continue
            echo "  [WARN] eval-like: $file:$line"
            VIOLATIONS=$((VIOLATIONS + 1))
          done < <(grep -rn 'eval(' --include='*.js' --include='*.html' . 2>/dev/null || true)

          # 2. innerHTML variable assignments — flag as INFO, these are normal UI patterns
          echo "[CHECK 2/12] Checking dynamic HTML injection ..."
          while IFS=: read -r file line content; do
            skip_file "$file" && continue
            rhs=$(echo "$content" | sed -n 's/.*innerHTML\s*=\s*//p')
            first="${rhs:0:1}"
            case "$first" in
              '"'|"'") ;;
              '`') echo "  [INFO] template innerHTML: $file:$line" ;;
              '') ;;
              *) echo "  [INFO] variable innerHTML: $file:$line (review manually)" ;;
            esac
          done < <(grep -rnE 'innerHTML\s*=' --include='*.js' --include='*.html' . 2>/dev/null || true)

          # 3. Large base64
          echo "[CHECK 3/12] Checking for suspicious base64 payloads ..."
          while IFS=: read -r file line rest; do
            skip_file "$file" && continue
            b64len=$(echo "$rest" | grep -oE '[A-Za-z0-9+/=]{100,}' | wc -c || true)
            if [ "${b64len:-0}" -gt 500 ] 2>/dev/null; then
              echo "  [WARN] large base64: $file:$line (${b64len} chars)"
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
          done < <(grep -rnE '[A-Za-z0-9+/=]{100,}' --include='*.js' --include='*.html' --include='*.json' . 2>/dev/null || true)

          # 4. setTimeout/setInterval with string
          echo "[CHECK 4/12] Checking setTimeout/setInterval with strings ..."
          while IFS=: read -r file line _; do
            skip_file "$file" && continue
            echo "  [WARN] string-based timer: $file:$line"
            VIOLATIONS=$((VIOLATIONS + 1))
          done < <(grep -rnE '(setTimeout|setInterval)[[:space:]]*\([[:space:]]*["'\'']' --include='*.js' . 2>/dev/null || true)

          # 5. Dynamic require
          echo "[CHECK 5/12] Checking dynamic require ..."
          while IFS=: read -r file line content; do
            skip_file "$file" && continue
            if echo "$content" | grep -qE 'require[[:space:]]*\([[:space:]]*[^"'\''[:space:]]'; then
              echo "  [WARN] dynamic require: $file:$line"
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
          done < <(grep -rnE 'require[[:space:]]*\(' --include='*.js' . 2>/dev/null || true)

          # 6. Heavy unicode escaping
          echo "[CHECK 6/12] Checking suspicious encoding ..."
          while IFS=: read -r file line; do
            skip_file "$file" && continue
            esc_count=$(grep -oE '\\\\u[0-9a-fA-F]{4}' "$file" 2>/dev/null | wc -l)
            if [ "${esc_count:-0}" -gt 10 ] 2>/dev/null; then
              echo "  [WARN] heavy unicode escaping: $file:$line ($esc_count escapes)"
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
          done < <(grep -rn '\\\\u' --include='*.js' . 2>/dev/null || true)

          # 7. Fetch to raw IP
          echo "[CHECK 7/12] Checking connections to raw IPs ..."
          while IFS=: read -r file line _; do
            skip_file "$file" && continue
            echo "  [WARN] connection to IP: $file:$line"
            VIOLATIONS=$((VIOLATIONS + 1))
          done < <(grep -rnE '(fetch|XMLHttpRequest|WebSocket)[[:space:]]*\(?[[:space:]]*["'\'']https?://[0-9]+\.[0-9]+' --include='*.js' --include='*.html' . 2>/dev/null || true)

          # 8. atob (info)
          echo "[CHECK 8/12] Checking atob usage ..."
          while IFS=: read -r file line; do
            skip_file "$file" && continue
            echo "  [INFO] atob usage: $file:$line"
          done < <(grep -rn 'atob(' --include='*.js' . 2>/dev/null || true)

          # 9. Storage sensitive keys
          echo "[CHECK 9/12] Checking storage access patterns ..."
          while IFS=: read -r file line content; do
            skip_file "$file" && continue
            if echo "$content" | grep -qE "(getItem|setItem)\(['\"](password|token|secret|key|credential|jwt|session)"; then
              echo "  [WARN] sensitive key in storage: $file:$line"
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
          done < <(grep -rnE '(localStorage|sessionStorage)\.(getItem|setItem)' --include='*.js' . 2>/dev/null || true)

          # 10. sendBeacon
          echo "[CHECK 10/12] Checking beacon / pixel tracking ..."
          while IFS=: read -r file line _; do
            skip_file "$file" && continue
            echo "  [WARN] tracking/beacon: $file:$line"
            VIOLATIONS=$((VIOLATIONS + 1))
          done < <(grep -rnE 'sendBeacon|navigator\.sendBeacon' --include='*.js' . 2>/dev/null || true)

          # 11. Package typosquatting
          echo "[CHECK 11/12] Checking package.json for suspicious dependencies ..."
          if [ -f package.json ]; then
            node -e "
              const p = JSON.parse(require('fs').readFileSync('package.json','utf8'));
              const deps = {...p.dependencies, ...p.devDependencies};
              const suspicious = Object.keys(deps).filter(d => {
                if (d.match(/^(eslint-|babel-|webpack-|gulp-|grunt-|express-)/) &&
                    !d.match(/^(eslint-config|eslint-plugin|babel-plugin|babel-preset|webpack-merge|express-validator)/)) return true;
                if (d.match(/^(react-|vue-|angular-)/) &&
                    !d.match(/^(react-dom|react-router|react-scripts|vue-router|vuex)/)) return true;
                return false;
              });
              if (suspicious.length) {
                suspicious.forEach(d => console.log('  [WARN] suspicious package: ' + d));
                process.exit(1);
              }
            " 2>/dev/null || VIOLATIONS=$((VIOLATIONS + 1))
          fi
          echo "  [PASS] or no issues detected"

          # 12. Unexpected binary files
          echo "[CHECK 12/12] Checking unexpected binary files in source ..."
          while IFS= read -r file; do
            case "$file" in
              */node_modules/*|*/dist/*|*/android/app/build/*|*/android/build/*|*/public/vendor/*) continue ;;
              *.png|*.jpg|*.jpeg|*.gif|*.svg|*.ico|*.woff|*.woff2|*.ttf|*.eot|*.onnx|*.bin|*.pb|*.jar|*.aar|*.keystore|*.jks|*.pdf|*.wasm) continue ;;
            esac
            if [ -f "$file" ] && file "$file" | grep -qE '(executable|binary|compress|archive)'; then
              echo "  [WARN] unexpected binary: $file ($(file -b "$file"))"
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
          done < <(find . -type f -not -path '*/\.git/*' 2>/dev/null || true)

          echo ""
          echo "----- Scan Result -----"
          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "RESULT: FAILED - Found $VIOLATIONS potential violations"
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              exit 1
            else
              echo "(warnings only - push event, not blocking)"
            fi
          else
            echo "RESULT: PASSED - No suspicious patterns found"
          fi

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Run gitleaks
        run: |
          gitleaks detect --source . \
            --no-git \
            --verbose \
            --report-format sarif \
            --report-path gitleaks-report.sarif \
            || true

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: gitleaks-report.sarif
          category: gitleaks

      - name: Summary
        run: |
          if [ -f gitleaks-report.sarif ]; then
            COUNT=$(jq '.runs[0].results | length' gitleaks-report.sarif)
            echo "----- Secrets Scan Result -----"
            if [ "$COUNT" -gt 0 ]; then
              echo "RESULT: FAILED - Found $COUNT potential secrets"
              jq -r '.runs[0].results[] | "  [WARN] \(.message.text) -- \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' gitleaks-report.sarif
              if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
                exit 1
              fi
            else
              echo "RESULT: PASSED - No secrets detected"
            fi
          fi

  code-compliance:
    name: Code Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: ESLint security & best-practice checks
        run: |
          npx eslint . \
            --no-eslintrc \
            --config <(cat <<'EOF'
          {
            "parserOptions": { "ecmaVersion": 2022, "sourceType": "module" },
            "env": { "browser": true, "es2022": true, "worker": true },
            "rules": {
              "no-eval": "error",
              "no-implied-eval": "error",
              "no-script-url": "error",
              "no-var": "warn",
              "prefer-const": "warn",
              "no-undef": "error",
              "no-unused-vars": ["warn", { "argsIgnorePattern": "^_" }],
              "no-console": "warn",
              "no-global-assign": "error",
              "no-new-func": "error",
              "no-cond-assign": "error",
              "no-debugger": "error"
            },
            "ignorePatterns": [
              "node_modules/", "dist/", "public/vendor/",
              "android/app/build/", "android/build/", "*.min.js", "*.onnx", "*.bin"
            ]
          }
          EOF
          ) \
            --format compact \
            --max-warnings 50 \
            --no-inline-config \
            || true

      - name: i18n compliance check
        run: |
          echo "===== i18n Compliance Check ====="
          node -e "
            const fs = require('fs');
            const path = require('path');
            function walk(dir) {
              const files = fs.readdirSync(dir);
              files.forEach(f => {
                const fp = path.join(dir, f);
                if (fs.statSync(fp).isDirectory()) {
                  if (f !== 'lang' && f !== 'test') walk(fp);
                } else if (fp.endsWith('.js') && !fp.includes('i18n')) {
                  const content = fs.readFileSync(fp, 'utf8');
                  const cjk = content.match(/[一-鿿　-〿＀-￯]/g);
                  if (cjk) {
                    cjk.forEach((_, idx) => {
                      const lineNum = content.substring(0, content.indexOf(cjk[0])).split('\n').length;
                      console.log('  [WARN] possible hardcoded Chinese: ' + fp + ':' + lineNum);
                    });
                  }
                }
              });
            }
            const src = path.join(process.cwd(), 'src');
            if (fs.existsSync(src)) walk(src);
          " 2>&1
          echo "(check output above for violations)"

      - name: Check file encoding
        run: |
          echo "===== File Encoding Check ====="
          ISSUES=0
          while IFS= read -r file; do
            encoding=$(file --mime-encoding "$file" 2>/dev/null | sed 's/.*: //')
            case "$encoding" in
              utf-8|us-ascii|ascii|binary) ;;
              *)
                echo "  [WARN] non-UTF-8 encoding ($encoding): $file"
                ISSUES=$((ISSUES + 1))
                ;;
            esac
          done < <(find . -name '*.js' -o -name '*.html' -o -name '*.css' -o -name '*.json' \
            -not -path '*/node_modules/*' \
            -not -path '*/dist/*' \
            -not -path '*/android/app/build/*' \
            -not -path '*/android/build/*' \
            -not -path '*/public/vendor/*' \
            -not -path '*/.git/*' \
            2>/dev/null)
          if [ "$ISSUES" -gt 0 ]; then
            echo "RESULT: FAILED - $ISSUES files with non-UTF-8 encoding"
          else
            echo "RESULT: PASSED - All files are UTF-8"
          fi

      - name: Integration tests
        run: |
          echo "===== Integration Tests ====="
          node test/test_integration.js 2>&1 || true

      - name: Compliance Summary
        run: |
          echo ""
          echo "===== Compliance Check Summary ====="
          echo "  - ESLint: security rules enforced (no-eval, no-undef, no-debugger, etc.)"
          echo "  - i18n: hardcoded Chinese text flagged"
          echo "  - Encoding: UTF-8 validated"
          echo "  - Tests: integration tests executed"
          echo ""
